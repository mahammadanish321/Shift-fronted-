<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="fav.ico">
    <title>Shift. Studio</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/home.css">

</head>

<body>

    <header>
        <a href="home.html" class="logo">Shift.</a>

        <div class="header-right">
            <!-- Token Display -->
            <div class="token-pill">
                <i class="fas fa-bolt token-icon"></i>
                <span id="headerCredits">0 / 0</span>
            </div>

            <a href="pricing.html" class="subscribe-btn" style="text-decoration: none;">
                <i class="fas fa-crown"></i> Subscribe
            </a>

            <!-- History Button (Circular) -->
            <a href="history.html" class="nav-icon-btn" title="History">
                <i class="fas fa-history"></i>
            </a>

            <div class="profile-container" onclick="toggleDropdown()">
                <div class="user-pill">
                    <div class="avatar" id="navAvatar"></div>
                    <div class="user-text">
                        <span class="user-name" id="navUsername">Anish</span>
                    </div>
                    <i class="fas fa-chevron-down"
                        style="font-size: 12px; margin-left: 5px; color: var(--text-muted);"></i>
                </div>
                <div class="dropdown-menu" id="profileMenu">
                    <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i> Profile</a>
                    <a href="#" class="dropdown-item"><i class="fas fa-cog"></i> Settings</a>
                    <a href="#" class="dropdown-item" id="themeBtn">
                        <i class="fas fa-moon" id="themeIcon"></i> <span id="themeText"> Dark Mode</span>
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item text-red"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="workflow-col">
            <div class="image-stack">
                <div class="img-frame" style="position: relative;">
                    <img id="sourceImg" src="" style="display:none;">
                    <span class="placeholder-text" id="sourcePlace">Original Image</span>
                    <button id="removeBtn" class="remove-btn" style="display: none;"><i
                            class="fas fa-times"></i></button>
                </div>
                <i class="fas fa-arrow-down" style="color:var(--accent-red); font-size: 20px;"></i>
                <div class="img-frame" style="position: relative;">
                    <img id="resultImg" src="" style="display:none;">
                    <span class="placeholder-text" id="resPlace">Result ??</span>
                    <div id="resultActions" class="result-actions" style="display: none;">
                        <button id="downloadBtn" class="action-btn" title="Download"><i
                                class="fas fa-download"></i></button>
                        <button id="editAgainBtn" class="action-btn" title="Edit Again"><i
                                class="fas fa-pen"></i></button>
                    </div>
                </div>
            </div>

            <div class="bottom-bar">
                <button class="btn btn-gray" id="uploadBtn" style="flex:1;"><i class="fas fa-upload"></i>
                    Upload</button>
                <button class="btn btn-blue" id="applyBtn" style="flex:2;">Apply Transform</button>
            </div>
        </div>

        <div class="controller-col">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button id="closePopupBtn" class="mobile-only-btn"
                        style="background: none; border: none; cursor: pointer; color: var(--text-main); font-size: 18px; padding: 0;">
                        <i class="fas fa-times"></i>
                    </button>
                    <h3 style="margin:0; color:var(--text-muted); font-size: 16px;">Camera position</h3>
                </div>
                <button id="resetBtn" title="Reset Camera"
                    style="background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 5px; border-radius: 5px; transition: all 0.2s;">
                    <i class="fas fa-undo"></i>
                </button>
            </div>

            <div class="control-grid">
                <div class="slider-v-wrap">
                    <input type="range" class="v-slider" id="pitchIn" min="-60" max="60" value="0">
                </div>

                <div class="dial-area">
                    <div class="dial-wrapper">
                        <div class="dial-ring">
                            <div class="notch"></div>
                            <div class="crosshair-v"></div>
                            <div class="crosshair-h"></div>
                            <div class="control-dot"></div>
                        </div>
                    </div>
                </div>

                <div class="slider-h-wrap">
                    <input type="range" class="h-slider" id="yawIn" min="-60" max="60" value="0">
                </div>
            </div>

            <div class="readout">
                <span>Move X: <b>0</b></span>
                <span>Move Y: <b>0</b></span>
                <span>Roll: <b>0°</b></span>
                <span>Pitch: <b>0°</b></span>
                <span>Yaw: <b>0°</b></span>
            </div>
        </div>
    </main>



    <div id="controllerOverlay" class="controller-overlay"></div>
    <button id="fabEdit" class="fab-edit"><i class="fas fa-sliders-h"></i></button>

    <div id="dragOverlay"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(45, 108, 223, 0.9); z-index: 9999; display: none; justify-content: center; align-items: center; flex-direction: column; color: white;">
        <i class="fas fa-cloud-download-alt" style="font-size: 80px; margin-bottom: 20px;"></i>
        <h2 style="font-size: 40px; margin: 0;">Drop Image Here</h2>
    </div>



    <script>


        function toggleDropdown() {
            document.getElementById('profileMenu').classList.toggle('active');
        }
        window.onclick = function (event) {
            if (!event.target.closest('.profile-container')) {
                document.getElementById('profileMenu').classList.remove('active');
            }
        }

        // Mobile Controller Toggle
        const fabEdit = document.getElementById('fabEdit');
        const controllerCol = document.querySelector('.controller-col');
        const controllerOverlay = document.getElementById('controllerOverlay');

        function toggleController() {
            controllerCol.classList.toggle('active');
            controllerOverlay.classList.toggle('active');

            // Toggle icon
            const icon = fabEdit.querySelector('i');
            if (controllerCol.classList.contains('active')) {
                icon.classList.remove('fa-sliders-h');
                icon.classList.add('fa-times');
            } else {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-sliders-h');
            }
        }

        if (fabEdit) {
            fabEdit.addEventListener('click', toggleController);
            controllerOverlay.addEventListener('click', toggleController);
        }

        const closePopupBtn = document.getElementById('closePopupBtn');
        if (closePopupBtn) {
            closePopupBtn.addEventListener('click', () => {
                if (controllerCol.classList.contains('active')) {
                    toggleController();
                }
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="routes/api.js"></script>
    <script src="routes/auth.js"></script>
    <script src="routes/images.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/home.js"></script>
</body>

</html>
