<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift. Studio</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* Page-specific Layout Overrides */
        main {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 25px;
            padding: 10px 25px 25px 25px;
            height: calc(100vh - 60px);
            min-height: 0;
        }

        /* Workflow Column Styles */
        .workflow-col {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

        .image-stack {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            min-height: 0;
        }

        .img-frame {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 10px;
            width: 100%;
            max-width: 500px;
            flex: 1;
            /* Allow equal splitting of space */
            min-height: 0;
            /* Crucial for flex item scrolling/sizing */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .img-frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            font-size: 24px;
            font-weight: bold;
            color: #ddd;
        }

        /* Buttons */
        .bottom-bar {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-blue {
            background: var(--accent-blue);
            color: white;
            flex-grow: 1;
        }

        .btn-gray {
            background: #eee;
            color: #333;
        }

        /* Responsive Fixes */
        @media (max-width: 900px) {
            main {
                display: flex;
                flex-direction: column;
                height: auto;
                padding-bottom: 50px;
            }

            .img-frame {
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="home.html" class="logo">Shift.</a>

        <div class="header-right">
            <div class="token-pill">
                <i class="fas fa-bolt token-icon"></i>
                <span>150 Tokens</span>
            </div>

            <a href="history.html" style="color: var(--accent-red); font-size: 20px;">
                <i class="fas fa-history"></i>
            </a>

            <div class="profile-container" onclick="toggleDropdown()">
                <div class="user-pill">
                    <div class="avatar"></div>
                    <span>User name</span>
                    <i class="fas fa-chevron-down" style="font-size: 10px; margin-left: 5px;"></i>
                </div>
                <div class="dropdown-menu" id="profileMenu">
                    <a href="#" class="dropdown-item"><i class="fas fa-user"></i> Profile</a>
                    <a href="#" class="dropdown-item"><i class="fas fa-cog"></i> Settings</a>
                    <a href="#" class="dropdown-item" id="themeBtn">
                        <i class="fas fa-moon" id="themeIcon"></i> <span id="themeText"> Dark Mode</span>
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item text-red"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="workflow-col">
            <div class="image-stack">
                <div class="img-frame" style="position: relative;">
                    <img id="sourceImg" src="" style="display:none;">
                    <span class="placeholder-text" id="sourcePlace">Original Image</span>
                    <button id="removeBtn" class="remove-btn" style="display: none;"><i
                            class="fas fa-times"></i></button>
                </div>
                <i class="fas fa-arrow-down" style="color:var(--accent-red); font-size: 20px;"></i>
                <div class="img-frame" style="position: relative;">
                    <img id="resultImg" src="" style="display:none;">
                    <span class="placeholder-text" id="resPlace">Result ??</span>
                    <div id="resultActions" class="result-actions" style="display: none;">
                        <button id="downloadBtn" class="action-btn" title="Download"><i
                                class="fas fa-download"></i></button>
                        <button id="editAgainBtn" class="action-btn" title="Edit Again"><i
                                class="fas fa-pen"></i></button>
                    </div>
                </div>
            </div>

            <div class="bottom-bar">
                <button class="btn btn-gray" id="uploadBtn" style="flex:1;"><i class="fas fa-upload"></i>
                    Upload</button>
                <button class="btn btn-blue" id="applyBtn" style="flex:2;">Apply Transform</button>
                <button class="btn btn-gray" id="resetBtn"><i class="fas fa-undo"></i></button>
            </div>
        </div>

        <div class="controller-col">
            <h3 style="margin:0 0 10px 0; color:#777; text-align:center;">Camera position</h3>

            <div class="control-grid">
                <div class="slider-v-wrap">
                    <input type="range" class="v-slider" id="pitchIn" min="-60" max="60" value="0">
                </div>

                <div class="dial-area">
                    <div class="dial-wrapper">
                        <div class="dial-ring">
                            <div class="notch"></div>
                            <div class="crosshair-v"></div>
                            <div class="crosshair-h"></div>
                            <div class="control-dot"></div>
                        </div>
                    </div>
                </div>

                <div class="slider-h-wrap">
                    <input type="range" class="h-slider" id="yawIn" min="-60" max="60" value="0">
                </div>
            </div>

            <div class="readout">
                <span>Move X: <b>0</b></span>
                <span>Move Y: <b>0</b></span>
                <span>Roll: <b>0°</b></span>
                <span>Pitch: <b>0°</b></span>
                <span>Yaw: <b>0°</b></span>
            </div>
        </div>
    </main>

    <div id="dragOverlay"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(45, 108, 223, 0.9); z-index: 9999; display: none; justify-content: center; align-items: center; flex-direction: column; color: white;">
        <i class="fas fa-cloud-download-alt" style="font-size: 80px; margin-bottom: 20px;"></i>
        <h2 style="font-size: 40px; margin: 0;">Drop Image Here</h2>
    </div>

    <script>
        function toggleDropdown() {
            document.getElementById('profileMenu').classList.toggle('active');
        }
        window.onclick = function (event) {
            if (!event.target.closest('.profile-container')) {
                document.getElementById('profileMenu').classList.remove('active');
            }
        }
    </script>
    <script src="theme.js"></script>
    <script src="home.js"></script>
</body>

</html>
