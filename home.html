<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="fav.ico">
    <title>Shift. Studio</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* Page-specific Layout Overrides */
        main {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 25px;
            padding: 10px 25px 25px 25px;
            height: calc(100vh - 60px);
            min-height: 0;
        }

        /* Workflow Column Styles */
        .workflow-col {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

        .image-stack {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            min-height: 0;
        }

        .img-frame {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 10px;
            width: 100%;
            max-width: 500px;
            flex: 1;
            /* Allow equal splitting of space */
            min-height: 0;
            /* Crucial for flex item scrolling/sizing */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .img-frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            font-size: 24px;
            font-weight: bold;
            color: #ddd;
        }

        /* Buttons */
        .bottom-bar {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-blue {
            background: var(--accent-blue);
            color: white;
            flex-grow: 1;
        }

        .btn-gray {
            background: #eee;
            color: #333;
        }

        /* Responsive Fixes */
        .fab-edit,
        .controller-overlay {
            display: none;
        }

        /* Hide on Desktop */
        /* Responsive Fixes & Mobile Layout Re-arrangement */
        @media (max-width: 900px) {
            main {
                display: flex;
                flex-direction: column;
                height: auto;
                /* Add padding to bottom to prevent content being hidden behind fixed footer */
                padding-bottom: 100px;
                overflow-x: hidden;
            }

            /* 
               CRITICAL: Use display: contents to "unwrap" the workflow-col 
               so we can reorder its children (.image-stack, .bottom-bar) 
               alongside .controller-col using CSS Order.
            */
            .workflow-col {
                display: contents;
            }

            /* 1. IMAGE ON TOP */
            .image-stack {
                order: 1;
                margin-bottom: 20px;
                /* Ensure it doesn't take unnecessary height */
                min-height: 300px;
            }

            .img-frame {
                min-height: 250px;
                max-height: 400px;
                /* Don't let it be too tall on huge phones */
            }

            /* 2. CONTROLS POPUP (Hidden by default) */
            .controller-col {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) scale(0.9);
                width: 85%;
                /* Slightly narrower */
                max-width: 320px;
                background: var(--panel-bg);
                border: 1px solid var(--border);
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
                z-index: 2000;
                padding: 15px;
                /* Reduced padding */
                border-radius: 20px;

                /* Hidden State */
                opacity: 0;
                pointer-events: none;
                transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            }

            /* Compact header inside popup */
            .controller-col h3 {
                margin: 0 0 5px 0 !important;
                font-size: 1rem !important;
            }

            .controller-col.active {
                opacity: 1;
                pointer-events: auto;
                transform: translate(-50%, -50%) scale(1);
            }

            /* Backdrop for popup */
            .controller-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(5px);
                z-index: 1500;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s;
            }

            .controller-overlay.active {
                opacity: 1;
                pointer-events: auto;
            }

            /* Floating Edit Button */
            .fab-edit {
                position: fixed;
                bottom: 100px;
                /* Above bottom bar */
                right: 25px;
                width: 60px;
                height: 60px;
                background: var(--accent-blue);
                color: white;
                border-radius: 50%;
                border: none;
                box-shadow: 0 5px 15px rgba(45, 108, 223, 0.4);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 24px;
                z-index: 950;
                /* Above bottom bar */
                cursor: pointer;
                transition: transform 0.2s;
            }

            .fab-edit:active {
                transform: scale(0.95);
            }

            /* RESTORE CONTROL GRID LAYOUT (Slider Left, Dial Right) */
            .control-grid {
                display: grid;
                grid-template-columns: 40px 1fr;
                /* Slider width | Dial space */
                grid-template-rows: 1fr 40px;
                /* Dial height | Bottom slider height */
                gap: 5px;
                /* Tighter gap */
                width: 100%;
                max-width: 350px;
                /* Constraint width */
                margin: 0 auto;
                /* Center the whole rig */
                padding: 0;
            }

            /* Vertical Slider on Left */
            .slider-v-wrap {
                order: unset;
                grid-row: 1;
                grid-column: 1;
                height: 100%;
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* Keep it vertical! */
            input.v-slider {
                transform: rotate(-90deg);
                width: 140px;
                /* Reduced length (was 160px) */
                height: 8px;
                /* Match thickness of horizontal slider */
                border-radius: 5px;
            }

            .dial-area {
                order: unset;
                grid-row: 1;
                grid-column: 2;
                display: flex;
                /* Ensure centering */
                align-items: center;
                justify-content: center;
            }

            .slider-h-wrap {
                order: unset;
                grid-row: 2;
                grid-column: 2;
            }

            .dial-wrapper {
                width: 140px;
                /* Reduced size (was 160px) */
                height: 140px;
            }

            /* 3. ACTIONS FIXED AT BOTTOM */
            .bottom-bar {
                order: 3;
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: var(--panel-bg);
                /* Match theme */
                padding: 15px 25px;
                box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.1);
                z-index: 900;
                border-top: 1px solid var(--border);

                /* Grid layout for buttons */
                display: grid;
                grid-template-columns: 1fr 2fr 1fr;
                gap: 10px;
                margin-top: 0;
            }

            .btn {
                height: 50px;
                /* Fat finger friendly */
                font-size: 1rem;
            }
    </style>

</head>

<body>

    <header>
        <a href="home.html" class="logo">Shift.</a>

        <div class="header-right">
            <!-- Token Display -->
            <div class="token-pill">
                <i class="fas fa-bolt token-icon"></i>
                <span id="headerCredits">0 / 0</span>
            </div>

            <a href="pricing.html" class="subscribe-btn" style="text-decoration: none;">
                <i class="fas fa-crown"></i> Subscribe
            </a>

            <!-- History Button (Circular) -->
            <a href="history.html" class="nav-icon-btn" title="History">
                <i class="fas fa-history"></i>
            </a>

            <div class="profile-container" onclick="toggleDropdown()">
                <div class="user-pill">
                    <div class="avatar" id="navAvatar"></div>
                    <div class="user-text">
                        <span class="user-name" id="navUsername">Anish</span>
                    </div>
                    <i class="fas fa-chevron-down"
                        style="font-size: 12px; margin-left: 5px; color: var(--text-muted);"></i>
                </div>
                <div class="dropdown-menu" id="profileMenu">
                    <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i> Profile</a>
                    <a href="#" class="dropdown-item"><i class="fas fa-cog"></i> Settings</a>
                    <a href="#" class="dropdown-item" id="themeBtn">
                        <i class="fas fa-moon" id="themeIcon"></i> <span id="themeText"> Dark Mode</span>
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item text-red"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="workflow-col">
            <div class="image-stack">
                <div class="img-frame" style="position: relative;">
                    <img id="sourceImg" src="" style="display:none;">
                    <span class="placeholder-text" id="sourcePlace">Original Image</span>
                    <button id="removeBtn" class="remove-btn" style="display: none;"><i
                            class="fas fa-times"></i></button>
                </div>
                <i class="fas fa-arrow-down" style="color:var(--accent-red); font-size: 20px;"></i>
                <div class="img-frame" style="position: relative;">
                    <img id="resultImg" src="" style="display:none;">
                    <span class="placeholder-text" id="resPlace">Result ??</span>
                    <div id="resultActions" class="result-actions" style="display: none;">
                        <button id="downloadBtn" class="action-btn" title="Download"><i
                                class="fas fa-download"></i></button>
                        <button id="editAgainBtn" class="action-btn" title="Edit Again"><i
                                class="fas fa-pen"></i></button>
                    </div>
                </div>
            </div>

            <div class="bottom-bar">
                <button class="btn btn-gray" id="uploadBtn" style="flex:1;"><i class="fas fa-upload"></i>
                    Upload</button>
                <button class="btn btn-blue" id="applyBtn" style="flex:2;">Apply Transform</button>
                <button class="btn btn-gray" id="resetBtn"><i class="fas fa-undo"></i></button>
            </div>
        </div>

        <div class="controller-col">
            <h3 style="margin:0 0 10px 0; color:#777; text-align:center;">Camera position</h3>

            <div class="control-grid">
                <div class="slider-v-wrap">
                    <input type="range" class="v-slider" id="pitchIn" min="-60" max="60" value="0">
                </div>

                <div class="dial-area">
                    <div class="dial-wrapper">
                        <div class="dial-ring">
                            <div class="notch"></div>
                            <div class="crosshair-v"></div>
                            <div class="crosshair-h"></div>
                            <div class="control-dot"></div>
                        </div>
                    </div>
                </div>

                <div class="slider-h-wrap">
                    <input type="range" class="h-slider" id="yawIn" min="-60" max="60" value="0">
                </div>
            </div>

            <div class="readout">
                <span>Move X: <b>0</b></span>
                <span>Move Y: <b>0</b></span>
                <span>Roll: <b>0°</b></span>
                <span>Pitch: <b>0°</b></span>
                <span>Yaw: <b>0°</b></span>
            </div>
        </div>
    </main>



    <div id="controllerOverlay" class="controller-overlay"></div>
    <button id="fabEdit" class="fab-edit"><i class="fas fa-sliders-h"></i></button>

    <div id="dragOverlay"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(45, 108, 223, 0.9); z-index: 9999; display: none; justify-content: center; align-items: center; flex-direction: column; color: white;">
        <i class="fas fa-cloud-download-alt" style="font-size: 80px; margin-bottom: 20px;"></i>
        <h2 style="font-size: 40px; margin: 0;">Drop Image Here</h2>
    </div>



    <script>


        function toggleDropdown() {
            document.getElementById('profileMenu').classList.toggle('active');
        }
        window.onclick = function (event) {
            if (!event.target.closest('.profile-container')) {
                document.getElementById('profileMenu').classList.remove('active');
            }
        }

        // Mobile Controller Toggle
        const fabEdit = document.getElementById('fabEdit');
        const controllerCol = document.querySelector('.controller-col');
        const controllerOverlay = document.getElementById('controllerOverlay');

        function toggleController() {
            controllerCol.classList.toggle('active');
            controllerOverlay.classList.toggle('active');

            // Toggle icon
            const icon = fabEdit.querySelector('i');
            if (controllerCol.classList.contains('active')) {
                icon.classList.remove('fa-sliders-h');
                icon.classList.add('fa-times');
            } else {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-sliders-h');
            }
        }

        if (fabEdit) {
            fabEdit.addEventListener('click', toggleController);
            controllerOverlay.addEventListener('click', toggleController);
        }
    </script>
    <script src="theme.js"></script>
    <script src="home.js"></script>
</body>

</html>
