<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="fav.ico">
    <title>Shift. | Profile</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/profile.css">
</head>

<body>

    <header>
        <a href="home.html" class="logo">Shift.</a>

        <div class="header-right">
            <!-- Token Display -->
            <div class="token-pill">
                <i class="fas fa-bolt token-icon"></i>
                <span id="headerCredits">0 / 0</span>
            </div>

            <a href="pricing.html" class="subscribe-btn" style="text-decoration: none;">
                <i class="fas fa-crown"></i> Subscribe
            </a>

            <!-- History Button (Circular) -->
            <a href="history.html" class="nav-icon-btn" title="History">
                <i class="fas fa-history"></i>
            </a>

            <!-- Home Button (Circular) -->
            <a href="home.html" class="nav-icon-btn" title="Home">
                <i class="fas fa-home"></i>
            </a>

            <div class="profile-container" onclick="toggleDropdown()">
                <div class="user-pill">
                    <div class="avatar" id="navAvatar"></div>
                    <div class="user-text">
                        <span class="user-name" id="navUsername"></span>
                    </div>
                    <i class="fas fa-chevron-down"
                        style="font-size: 12px; margin-left: 5px; color: var(--text-muted);"></i>
                </div>
                <div class="dropdown-menu" id="profileMenu">
                    <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i> Profile</a>
                    <a href="#" class="dropdown-item"><i class="fas fa-cog"></i> Settings</a>
                    <a href="#" class="dropdown-item" id="themeBtn">
                        <i class="fas fa-moon" id="themeIcon"></i> <span id="themeText"> Dark Mode</span>
                    </a>
                    <a href="report-issue.html" class="dropdown-item">
                        <i class="fas fa-bug"></i> Report Issue
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item text-red"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <main class="profile-main-container">

        <!-- Profile Card -->
        <div class="profile-card">
            <div class="cover-wrapper">
                <img src="" alt="Cover Image" class="cover-image" id="profileCover">
            </div>

            <div class="profile-info-bar">
                <div class="profile-identity">
                    <img src="" alt="Profile" class="avatar-large" id="profileAvatar">
                    <div class="user-details">
                        <h1 id="profileName"></h1>
                        <p class="user-handle" id="profileHandle"></p>
                    </div>
                </div>

                <div class="profile-actions">
                    <button id="editProfileBtn" class="btn btn-blue-outline"
                        style="padding: 8px 20px; font-weight: 600; border-radius: 8px; cursor: pointer;">
                        Edit Profile
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon bg-purple">
                    <i class="fas fa-coins"></i>
                </div>
                <div class="stat-info">
                    <h4>Available Credits</h4>
                    <p id="profileCredits">-</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon bg-blue">
                    <i class="fas fa-star"></i>
                </div>
                <div class="stat-info">
                    <h4>Plan</h4>
                    <p id="profilePlan">-</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-green">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="stat-info">
                    <h4>Email</h4>
                    <p id="profileEmail" style="font-size: 16px; overflow: hidden; text-overflow: ellipsis;">-</p>
                </div>
            </div>
        </div>

        <!-- History / Details -->
        <div class="profile-card" style="padding: 25px;">
            <div class="history-section">
                <h2>Watch History</h2>
                <div id="watchHistoryList">
                    <p style="color: var(--text-muted);">No history available.</p>
                </div>
            </div>
        </div>

        <!-- Edit Profile Modal -->
        <div id="editProfileModal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Edit Profile</h2>
                    <button class="close-modal-btn" id="closeModalBtn"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-body">
                    <!-- Avatar Upload -->
                    <div class="avatar-upload-container">
                        <div class="avatar-wrapper">
                            <img src="" id="editAvatarPreview" class="avatar-preview">
                            <button id="changeAvatarBtn" class="camera-btn">
                                <i class="fas fa-camera"></i>
                            </button>
                        </div>
                        <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                        <input type="file" id="coverInput" accept="image/*" style="display: none;">
                    </div>

                    <!-- Cover Image Upload -->
                    <div class="form-group">
                        <label>Cover Image</label>
                        <div id="editCoverPreview" class="cover-upload-preview">
                            <span class="cover-upload-text"><i class="fas fa-image"></i> Click to change cover</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="editName">Display Name</label>
                        <input type="text" id="editName" class="form-input" placeholder="e.g. Anish">
                    </div>
                    <div class="form-group">
                        <label for="editHandle">Username (@)</label>
                        <input type="text" id="editHandle" class="form-input" placeholder="e.g. anish_dev">
                    </div>

                </div>
                <div class="modal-footer">
                    <button class="btn-cancel" id="cancelEditBtn">Cancel</button>
                    <button class="btn-save" id="saveProfileBtn">Save Changes</button>
                </div>
            </div>
        </div>

    </main>

    <script>
        function toggleDropdown() {
            document.getElementById('profileMenu').classList.toggle('active');
        }
        window.onclick = function (event) {
            if (!event.target.closest('.profile-container')) {
                document.getElementById('profileMenu').classList.remove('active');
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="routes/api.js"></script>
    <script src="routes/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/profile.js"></script>
</body>

</html>
