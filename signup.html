<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="fav.ico">
    <title>Shift | Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <nav>
        <a href="index.html" class="logo">Shift.</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-card">
            <h2>Create Account</h2>
            <!-- Error Message Container (Hidden by default) -->
            <div id="error-message"
                style="display: none; color: #ffeb3b; background: rgba(255, 0, 0, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; border: 1px solid rgba(255, 0, 0, 0.3);">
            </div>

            <form id="signup-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" required placeholder="John Doe">
                </div>
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" required placeholder="johndoe123">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Create a password">
                </div>
                <button type="submit" class="btn-submit">Sign Up</button>
            </form>

            <div class="separator">Or continue with</div>

            <button class="btn-google">
                <i class="fab fa-google"></i> Google
            </button>

            <div class="switch-link">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>


    <!-- Scripts -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="routes/api.js"></script>
    <script src="routes/auth.js"></script>
    <script src="js/signup.js"></script>

</body>

</html>
