<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="fav.ico">
    <title>Shift. - History</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/history.css">
</head>

<body>

    <header>
        <a href="home.html" class="logo">Shift.</a>

        <div class="header-right">
            <div class="token-pill">
                <i class="fas fa-bolt token-icon"></i>
                <span id="headerCredits">0 / 0</span>
            </div>

            <a href="pricing.html" class="subscribe-btn" style="text-decoration: none;">
                <i class="fas fa-crown"></i> Subscribe
            </a>

            <!-- Home Button (Circular) - different from History Page reference but replacing consistent with request -->
            <a href="home.html" class="nav-icon-btn" title="Home">
                <i class="fas fa-home"></i>
            </a>

            <div class="profile-container" onclick="toggleDropdown()">
                <div class="user-pill">
                    <div class="avatar" id="navAvatar"></div>
                    <div class="user-text">
                        <span class="user-name" id="navUsername"></span>
                    </div>
                    <i class="fas fa-chevron-down"
                        style="font-size: 12px; margin-left: 5px; color: var(--text-muted);"></i>
                </div>
                <div class="dropdown-menu" id="profileMenu">
                    <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i> Profile</a>
                    <a href="#" class="dropdown-item" id="themeBtn">
                        <i class="fas fa-moon" id="themeIcon"></i> <span id="themeText"> Dark Mode</span>
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item text-red"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div class="history-container">
        <h1>Generation History</h1>

        <div class="history-grid">
            <!-- Dynamic History Cards will be injected here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="routes/api.js"></script>
    <script src="routes/auth.js"></script>
    <script src="routes/images.js"></script>
    <script src="js/theme.js"></script>
    <script>
        function toggleDropdown() {
            document.getElementById('profileMenu').classList.toggle('active');
        }
        window.onclick = function (event) {
            if (!event.target.closest('.profile-container')) {
                document.getElementById('profileMenu').classList.remove('active');
            }
        }

        // --- HISTORY PAGE LOGIC ---

        // 1. Download Functionality
        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            initUser();
            loadHistory();
        });

        async function initUser() {
            try {
                const userData = await AuthAPI.getCurrentUser();
                const user = userData.data.user || userData.data || userData;

                const navUsername = document.getElementById('navUsername');
                const headerCredits = document.getElementById('headerCredits');

                if (navUsername) navUsername.innerText = user.username || user.fullName || 'User';
                if (headerCredits) {
                    const limit = user.subscription && user.subscription.limit ? user.subscription.limit : 5;
                    headerCredits.innerText = `${user.credits || 0} / ${limit}`;
                }

                const navAvatar = document.getElementById('navAvatar');
                const avatarUrl = user.avatar || user.avatarUrl;
                if (navAvatar && avatarUrl && typeof avatarUrl === 'string' && avatarUrl.trim() !== '') {
                    navAvatar.style.backgroundImage = `url('${avatarUrl}')`;
                    navAvatar.style.backgroundSize = 'cover';
                }
            } catch (error) {
                console.error("Failed to load user:", error);
            }
        }

        async function loadHistory() {
            const grid = document.querySelector('.history-grid');
            if (!grid) return;

            grid.innerHTML = '<p style="color:white;">Loading history...</p>';

            try {
                const response = await ImageAPI.getHistory();
                // Expecting response.data.history or response.data which is an array
                const historyList = response.data.history || response.data || [];

                grid.innerHTML = '';

                if (historyList.length === 0) {
                    grid.innerHTML = '<p style="color:var(--text-muted); padding: 20px;">No generation history found. Start creating!</p>';
                    return;
                }

                historyList.forEach(item => {
                    // item: { _id, originalImageUrl, transformedImageUrl, createdAt, parameters: { pitch, yaw, roll }, ... }

                    const date = new Date(item.createdAt).toLocaleString();
                    const title = `Pitch: ${item.parameters.pitch}, Yaw: ${item.parameters.yaw}, Roll: ${item.parameters.roll}`;
                    const imgUrl = item.transformedImageUrl;

                    const card = document.createElement('div');
                    card.className = 'history-card';
                    card.innerHTML = `
                        <div class="card-img">
                            <img src="${imgUrl}" alt="Generated" class="history-image" onerror="this.src='/api/placeholder/400/320'">
                        </div>
                        <div class="card-body">
                            <div class="card-date">${date}</div>
                            <div class="card-title" style="font-size: 0.9em;">${title}</div>
                            <div class="card-actions">
                                <button class="history-btn btn-download" onclick="downloadImage('${imgUrl}')">
                                    <i class="fas fa-download"></i>
                                </button>
                                <button class="history-btn btn-edit" onclick="editAgain('${imgUrl}')">
                                    Edit Again
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error("Failed to load history:", error);
                grid.innerHTML = `<p style="color:var(--text-red);">Failed to load history: ${getErrorMessage(error)}</p>`;
            }
        }

        // 1. Download Functionality
        async function downloadImage(url) {
            try {
                // Fetch the image as a blob to force download instead of nav
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = `shift-image-${Date.now()}.png`; // png or jpg based on content-type usually
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.error("Download failed:", error);
                // Fallback
                const link = document.createElement('a');
                link.href = url;
                link.download = 'download';
                link.target = '_blank';
                link.click();
            }
        }

        // 2. Edit Again Functionality
        function editAgain(url) {
            // Save the image URL to localStorage so home.html can read it
            localStorage.setItem('shift_edit_image', url);
            // Navigate to home
            window.location.href = 'home.html';
        }
    </script>
</body>

</html>
