<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift. - History</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* History Page Specific Styles */
        .history-container {
            padding: 30px;
            overflow-y: auto;
            /* Enable scrolling for history grid */
            height: calc(100vh - 60px);
        }

        h1 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 24px;
            margin-bottom: 20px;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .history-card {
            background: var(--panel-bg);
            border-radius: 15px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .history-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .card-img {
            width: 100%;
            height: 180px;
            background-color: var(--dropdown-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
        }

        .card-date {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .card-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <header>
        <a href="home.html" class="logo">Shift.</a>

        <div class="header-right">
            <div class="token-pill">
                <i class="fas fa-bolt token-icon"></i>
                <span>150 Tokens</span>
            </div>

            <a href="home.html" style="color: var(--text-muted); font-size: 20px;">
                <i class="fas fa-home"></i>
            </a>

            <div class="profile-container" onclick="toggleDropdown()">
                <div class="user-pill">
                    <div class="avatar"></div>
                    <span>User name</span>
                    <i class="fas fa-chevron-down" style="font-size: 10px; margin-left: 5px;"></i>
                </div>
                <div class="dropdown-menu" id="profileMenu">
                    <a href="#" class="dropdown-item"><i class="fas fa-user"></i> Profile</a>
                    <a href="#" class="dropdown-item" id="themeBtn">
                        <i class="fas fa-moon" id="themeIcon"></i> <span id="themeText"> Dark Mode</span>
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item text-red"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div class="history-container">
        <h1>Generation History</h1>

        <div class="history-grid">

            <div class="history-card">
                <div class="card-img">
                    <img src="https://picsum.photos/300/200?random=1" alt="Generated">
                </div>
                <div class="card-body">
                    <div class="card-date">Dec 31, 2024 • 10:42 AM</div>
                    <div class="card-title">Portrait Tilt Fix</div>
                    <div class="card-actions">
                        <button class="action-btn"><i class="fas fa-download"></i></button>
                        <button class="action-btn"
                            style="background: var(--accent-blue); color: white; border: none;">Edit Again</button>
                    </div>
                </div>
            </div>

            <div class="history-card">
                <div class="card-img">
                    <img src="https://picsum.photos/300/200?random=2" alt="Generated">
                </div>
                <div class="card-body">
                    <div class="card-date">Dec 30, 2024 • 2:15 PM</div>
                    <div class="card-title">Landscape Rotate</div>
                    <div class="card-actions">
                        <button class="action-btn"><i class="fas fa-download"></i></button>
                        <button class="action-btn"
                            style="background: var(--accent-blue); color: white; border: none;">Edit Again</button>
                    </div>
                </div>
            </div>

            <div class="history-card">
                <div class="card-img">
                    <img src="https://picsum.photos/300/200?random=3" alt="Generated">
                </div>
                <div class="card-body">
                    <div class="card-date">Dec 28, 2024 • 9:00 AM</div>
                    <div class="card-title">Product Shot Yaw</div>
                    <div class="card-actions">
                        <button class="action-btn"><i class="fas fa-download"></i></button>
                        <button class="action-btn"
                            style="background: var(--accent-blue); color: white; border: none;">Edit Again</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="theme.js"></script>
    <script>
        function toggleDropdown() {
            document.getElementById('profileMenu').classList.toggle('active');
        }
        window.onclick = function (event) {
            if (!event.target.closest('.profile-container')) {
                document.getElementById('profileMenu').classList.remove('active');
            }
        }
    </script>
</body>

</html>
