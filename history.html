<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="fav.ico">
    <title>Shift. - History</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/history.css">
</head>

<body>

    <header>
        <a href="home.html" class="logo">Shift.</a>

        <div class="header-right">
            <div class="token-pill">
                <i class="fas fa-bolt token-icon"></i>
                <span id="headerCredits">0 / 0</span>
            </div>

            <a href="pricing.html" class="subscribe-btn" style="text-decoration: none;">
                <i class="fas fa-crown"></i> Subscribe
            </a>

            <!-- Home Button (Circular) - different from History Page reference but replacing consistent with request -->
            <a href="home.html" class="nav-icon-btn" title="Home">
                <i class="fas fa-home"></i>
            </a>

            <div class="profile-container" onclick="toggleDropdown()">
                <div class="user-pill">
                    <div class="avatar" id="navAvatar"></div>
                    <div class="user-text">
                        <span class="user-name" id="navUsername">Anish</span>
                    </div>
                    <i class="fas fa-chevron-down"
                        style="font-size: 12px; margin-left: 5px; color: var(--text-muted);"></i>
                </div>
                <div class="dropdown-menu" id="profileMenu">
                    <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i> Profile</a>
                    <a href="#" class="dropdown-item" id="themeBtn">
                        <i class="fas fa-moon" id="themeIcon"></i> <span id="themeText"> Dark Mode</span>
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item text-red"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div class="history-container">
        <h1>Generation History</h1>

        <div class="history-grid">

            <div class="history-card">
                <div class="card-img">
                    <img src="https://picsum.photos/300/200?random=1" alt="Generated" class="history-image">
                </div>
                <div class="card-body">
                    <div class="card-date">Dec 31, 2024 • 10:42 AM</div>
                    <div class="card-title">Portrait Tilt Fix</div>
                    <div class="card-actions">
                        <button class="history-btn btn-download"
                            onclick="downloadImage('https://picsum.photos/300/200?random=1')">
                            <i class="fas fa-download"></i>
                        </button>
                        <button class="history-btn btn-edit"
                            onclick="editAgain('https://picsum.photos/300/200?random=1')">
                            Edit Again
                        </button>
                    </div>
                </div>
            </div>

            <div class="history-card">
                <div class="card-img">
                    <img src="https://picsum.photos/300/200?random=2" alt="Generated" class="history-image">
                </div>
                <div class="card-body">
                    <div class="card-date">Dec 30, 2024 • 2:15 PM</div>
                    <div class="card-title">Landscape Rotate</div>
                    <div class="card-actions">
                        <button class="history-btn btn-download"
                            onclick="downloadImage('https://picsum.photos/300/200?random=2')">
                            <i class="fas fa-download"></i>
                        </button>
                        <button class="history-btn btn-edit"
                            onclick="editAgain('https://picsum.photos/300/200?random=2')">
                            Edit Again
                        </button>
                    </div>
                </div>
            </div>

            <div class="history-card">
                <div class="card-img">
                    <img src="https://picsum.photos/300/200?random=3" alt="Generated" class="history-image">
                </div>
                <div class="card-body">
                    <div class="card-date">Dec 28, 2024 • 9:00 AM</div>
                    <div class="card-title">Product Shot Yaw</div>
                    <div class="card-actions">
                        <button class="history-btn btn-download"
                            onclick="downloadImage('https://picsum.photos/300/200?random=3')">
                            <i class="fas fa-download"></i>
                        </button>
                        <button class="history-btn btn-edit"
                            onclick="editAgain('https://picsum.photos/300/200?random=3')">
                            Edit Again
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/theme.js"></script>
    <script>
        function toggleDropdown() {
            document.getElementById('profileMenu').classList.toggle('active');
        }
        window.onclick = function (event) {
            if (!event.target.closest('.profile-container')) {
                document.getElementById('profileMenu').classList.remove('active');
            }
        }

        // --- HISTORY PAGE LOGIC ---

        // 1. Download Functionality
        async function downloadImage(url) {
            try {
                // Fetch the image as a blob to force download instead of nav
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = `shift-image-${Date.now()}.jpg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.error("Download failed:", error);
                // Fallback for simple images
                const link = document.createElement('a');
                link.href = url;
                link.download = 'download';
                link.target = '_blank';
                link.click();
            }
        }

        // 2. Edit Again Functionality
        function editAgain(url) {
            // Save the image URL to localStorage so home.html can read it
            localStorage.setItem('shift_edit_image', url);
            // Navigate to home
            window.location.href = 'home.html';
        }
    </script>
</body>

</html>
