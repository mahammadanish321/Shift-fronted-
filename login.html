<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="fav.ico">
    <title>Shift | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #ffffff;
            --accent: #ebff00;
            --secondary: #888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- NAVIGATION --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 4rem;
            position: fixed;
            width: 100%;
            z-index: 100;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(5px);
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -1px;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* --- FORM SECTION --- */
        .login-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            padding-top: 80px;
            /* offset for nav */
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #111;
            padding: 3rem;
            border: 1px solid #222;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .login-card h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--secondary);
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            background: transparent;
            border: 1px solid #333;
            padding: 1rem;
            color: white;
            font-family: inherit;
            font-size: 16px;
            /* Prevent zoom on mobile */
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .btn-submit {
            width: 100%;
            background: var(--text);
            color: var(--bg);
            padding: 1rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: var(--accent);
            transform: scale(1.02);
        }

        .switch-link {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--secondary);
        }

        .switch-link a {
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
        }

        /* Mobile */
        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
            }

            .login-card {
                padding: 2rem;
            }
        }

        /* --- GOOGLE AUTH --- */
        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--secondary);
            font-size: 0.8rem;
        }

        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #333;
        }

        .separator::before {
            margin-right: .5em;
        }

        .separator::after {
            margin-left: .5em;
        }

        .btn-google {
            width: 100%;
            background: white;
            color: black;
            padding: 0.8rem;
            /* Slightly less padding to match height if needed */
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            background: #eee;
            transform: scale(1.02);
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html" class="logo">Shift.</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="signup.html">Sign Up</a>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <form action="home.html">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Login</button>
            </form>

            <div class="separator">Or continue with</div>

            <button class="btn-google">
                <i class="fab fa-google"></i> Google
            </button>

            <div class="switch-link">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
        </div>
    </div>

</body>

</html>
